{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DraftSky</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body class="{{ .Theme }}">

<div class="app">

    <!-- Left Rail -->
    <aside class="left-rail">
        <div class="left-rail-inner">
            <div class="profile">
                {{if .User.Avatar}}
                <img class="avatar-img" src="{{.User.Avatar}}" alt="Avatar">
                {{else}}
                <div class="avatar-placeholder"></div>
                {{end}}
                <span class="handle">@{{.User.Handle}}</span>
            </div>

            <nav class="nav">
                <a href="/" class="nav-link">Home</a>
                <a href="/templates" class="nav-link">Templates</a>
                <a href="/settings" class="nav-link">Settings</a>
                <hr class="nav-divider">
                <button class="btn-new-post" onclick="openComposer()">New Post</button>
                <form action="/auth/logout" method="POST">
                    <button type="submit" class="nav-link btn-logout">Sign out</button>
                </form>
            </nav>
        </div>
    </aside>

    <!-- Centre -->
    <main class="centre">
        {{template "content" .}}
    </main>

    <!-- Right Rail -->
    <aside class="right-rail">
        <h2 class="rail-heading">Recent Tags</h2>
        {{if .RecentTags}}
        <ul class="recent-tags">
            {{range .RecentTags}}
            <li><button type="button" class="tag-link" onclick="switchToHashtagFeed(['{{.}}'])">#{{.}}</button></li>
            {{end}}
        </ul>
        {{else}}
        <p class="muted-text">No recent tags yet.</p>
        {{end}}
    </aside>

</div>

{{template "composer" .}}

<script src="/static/app.js"></script>
</body>
</html>
{{end}}
