{{define "feed-controls"}}
<div class="feed-controls">
    {{if eq .FeedType "hashtag"}}
    <div class="feed-controls-inner">
        <span class="feed-label">
            Hashtag Feed:
            {{range .FeedTags}}<span class="feed-active-tag">#{{.}}</span> {{end}}
        </span>
        <button class="btn-back"
                hx-get="/feed/following"
                hx-target="#feed-root"
                hx-swap="innerHTML">Back to Following</button>
    </div>
    {{else}}
    <div class="feed-controls-inner">
        <span class="feed-label">Following</span>
    </div>
    {{end}}
</div>
{{end}}
